name: MokN
description: 'MokN is a cybersecurity company that helps organizations detect external
  threats before attackers can weaponize them. Founded by SOC practitioners after a
  major cyber crisis, MokN builds the detection layer around two products: Baits, defensive
  deception pages that lure attackers into revealing stolen credentials and validate
  compromise in real time, and Lantern, an external attack surface management tool that
  maps and remediates perimeter exposures. The platform reports processing over one
  billion login attempts and protecting hundreds of thousands of users across organizations.
  MokN publishes no public API, SDK, or developer documentation as of this pass; this
  profile captures the company''s public web presence and domain-security posture.'
